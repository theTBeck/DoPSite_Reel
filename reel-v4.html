<body class="reel-page">

<button type="button" class="site-back" id="reelBackBtn" aria-label="THE LIGHT BREAKS WHERE THERE IS NO SUNSHINE [VOLTE] — voltar à página anterior">
  <span class="site-back-phrase">THE LIGHT BREAKS WHERE THERE IS NO SUNSHINE</span>
  <span class="site-back-volte">[VOLTE]</span>
</button>

<main class="reel-stage" id="reelStage" aria-label="Reel — Cine Beck">
  <video
    class="reel-stage-video"
    id="reelPageVideo"
    src="reel_v1_capcut_ritchie_1080p.mp4"
    poster="assets/posters/reel-v4.jpg"
    autoplay muted loop playsinline preload="auto"></video>
</main>

<button
  type="button"
  class="hero-audio-btn"
  id="reelAudioBtn"
  aria-pressed="false"
  aria-label="Silenciar reel">
  <span class="hero-audio-btn-ico" aria-hidden="true"></span>
  <span class="hero-audio-btn-label">AUDIO</span>
</button>

<script type="module">
import { audioManager } from './js/audio-manager.js';
import { log } from './js/logger.js';

(() => {
  const v = document.getElementById("reelPageVideo");
  const audioBtn = document.getElementById("reelAudioBtn");
  const audioLabel = audioBtn?.querySelector(".hero-audio-btn-label");
  const backBtn = document.getElementById("reelBackBtn");
  if (!v) return;

  // Attach audio manager (starts muted)
  const bus = audioManager.attach(v, false);
  
  const goBack = () => {
    v.pause();
    bus.setWanted(false);
    if (window.history.length > 1) window.history.back();
    else window.location.href = "index.html#hero";
  };

  const syncAudioBtn = () => {
    if (!audioBtn) return;
    const muted = !bus.isAudible();
    audioBtn.classList.toggle("is-muted", muted);
    audioBtn.setAttribute("aria-pressed", String(muted));
    audioBtn.setAttribute("aria-label", muted ? "Ativar som do reel" : "Silenciar reel");
    if (audioLabel) audioLabel.textContent = muted ? "MUTED" : "AUDIO";
  };

  const play = () => v.play().catch(() => {});

  const kickAutoplay = () => {
    v.muted = true;
    v.volume = 1;
    syncAudioBtn();
    play();
  };

  kickAutoplay();
  v.addEventListener("canplay", () => {
    if (v.paused) kickAutoplay();
  });

  // Gesture unlock
  const unlock = () => {
    bus.setWanted(true);
    v.play().catch(_ => {});
    document.removeEventListener('pointerdown', unlock, { capture: true });
    document.removeEventListener('keydown', unlock, { capture: true });
    syncAudioBtn();
  };
  document.addEventListener('pointerdown', unlock, { once: true, capture: true });
  document.addEventListener('keydown', unlock, { once: true, capture: true });

  backBtn?.addEventListener("click", (e) => {
    e.preventDefault();
    goBack();
  });

  if (audioBtn) {
    audioBtn.addEventListener("click", () => {
      const currentlyAudible = bus.isAudible();
      if (currentlyAudible) {
        bus.setWanted(false);
      } else {
        audioManager.resume();
        v.muted = false;
        bus.setWanted(true);
        v.play().catch(_ => {});
      }
      syncAudioBtn();
    });
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") goBack();
    if (e.key === " " || e.code === "Space") {
      e.preventDefault();
      if (v.paused) v.play().catch(_ => {});
      else v.pause();
    }
    if (e.key.toLowerCase() === "m") {
      const currentlyAudible = bus.isAudible();
      if (currentlyAudible) bus.setWanted(false);
      else {
        audioManager.resume();
        v.muted = false;
        bus.setWanted(true);
        v.play().catch(_ => {});
      }
      syncAudioBtn();
    }
  });

  window.addEventListener("pagehide", () => {
    v.pause();
    bus.setWanted(false);
  });
})();
</script>
